name: Test Dask macOS (Debug #4074)

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - 'debug-4074*'  # Trigger on branches starting with debug-4074

env:
  # Enable ASAN symbolization
  ASAN_OPTIONS: symbolize=1:detect_leaks=0:halt_on_error=0:print_stacktrace=1
  ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer

jobs:
  test-dask-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        run_number: [1, 2, 3, 4, 5]  # Run 5 times in parallel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn pandas dask distributed cloudpickle joblib pytest pyarrow

      - name: Build LightGBM with ASAN and debug symbols
        run: |
          mkdir build && cd build
          cmake .. \
            -DUSE_SANITIZER=ON \
            -DENABLED_SANITIZERS="address" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-g -fno-omit-frame-pointer"
          make -j4
          cd ..

      - name: Install LightGBM Python package
        run: |
          cd python-package
          pip install --verbose .

      - name: Run failing dask test (attempt ${{ matrix.run_number }})
        run: |
          cd tests/python_package_test
          # Run the specific test that fails intermittently with verbose output
          python -m pytest test_dask.py::test_model_and_local_version_are_picklable_whether_or_not_client_set_explicitly \
            -v --tb=long -s 2>&1 | tee test_output.log
        continue-on-error: true

      - name: Capture system info on failure
        if: always()
        run: |
          echo "=== System Info ===" >> test_info.log
          uname -a >> test_info.log
          python --version >> test_info.log
          echo "=== Installed packages ===" >> test_info.log
          pip list >> test_info.log

      - name: Upload all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-run-${{ matrix.run_number }}
          path: |
            tests/python_package_test/test_output.log
            test_info.log
