name: Debug Dask macOS (#4074)

on:
  workflow_dispatch:
  push:
    branches:
      - 'debug-4074*'

env:
  BUILD_ARTIFACTSTAGINGDIRECTORY: '${{ github.workspace }}/artifacts'
  BUILD_SOURCESDIRECTORY: '${{ github.workspace }}'
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  SKBUILD_STRICT_CONFIG: true

jobs:
  test-dask-macos:
    name: dask test (macos-14, ${{ matrix.compiler }}, Python ${{ matrix.python_version }}, run ${{ matrix.run_number }})
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Copy exact config from failing jobs, run multiple times
          - compiler: gcc
            python_version: '3.11'
            run_number: 1
          - compiler: gcc
            python_version: '3.11'
            run_number: 2
          - compiler: gcc
            python_version: '3.11'
            run_number: 3
          - compiler: clang
            python_version: '3.11'
            run_number: 1
          - compiler: clang
            python_version: '3.11'
            run_number: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 5
          persist-credentials: false
          submodules: true
      - name: Setup and run tests
        shell: bash
        run: |
          export COMPILER="${{ matrix.compiler }}"
          export TASK="regular"
          export OS_NAME="macos"
          export PYTHON_VERSION="${{ matrix.python_version }}"
          export BUILD_DIRECTORY="$GITHUB_WORKSPACE"
          export CONDA=${HOME}/miniforge
          export PATH=${CONDA}/bin:${PATH}

          # Run the exact same setup as the real CI
          $GITHUB_WORKSPACE/.ci/setup.sh || exit 1

          # But only run dask tests (not full test suite)
          source ${CONDA}/bin/activate
          conda activate test-env

          cd $GITHUB_WORKSPACE/tests/python_package_test
          python -m pytest test_dask.py::test_model_and_local_version_are_picklable_whether_or_not_client_set_explicitly \
            -v --tb=long -s 2>&1 | tee $GITHUB_WORKSPACE/test_output_${{ matrix.run_number }}.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.compiler }}-run-${{ matrix.run_number }}
          path: test_output_*.log
